# =============================================================================
# openocd/f103rb.cfg —— 把「板子」讲清楚：调试器链路 + 目标芯片 + 复位方式
#
# 用法（在 stm32/02-libopencm3-blink 下）：
#   make flash          # 编程 + 校验 + 复位 + 退出
#   make openocd        # 前台常驻，开出 :3333 GDB 端口
#   openocd -s <scripts> -f openocd/f103rb.cfg
#
# -s 的作用：把「-f 文件里 find 的相对路径」的搜索根指向 openocd 自带的 scripts 目录。
# 本机是：~/.local/xpack-openocd-0.12.0-7/openocd/scripts
# 没有 -s 就会报 "Can't find interface/stlink-v2-1.cfg"。
#
# ⚠ 板子还没有实物在手，这份配置是按官方板卡脚本写的，等插上就能用。
# =============================================================================

# --- 1. 调试器 -----------------------------------------------------------------
# NUCLEO-F103RB 板载 ST-Link/V2-1（走 SWD，占 PA13/PA14）。
# 板卡脚本已经自动 source 了 interface/stlink-v2-1.cfg。
source [find board/st_nucleo_f103rb.cfg]

# --- 2. 目标芯片 ---------------------------------------------------------------
# 板卡脚本内部已经 source 了 target/stm32f1x.cfg，内容等价于：
#   set _CHIPNAME stm32f1x
#   set _CPUTAPID 0x1ba01477
#   swd newdap ...
#   cortex_m   newtap $_CHIPNAME cpu    # Cortex-M3，无 FPU
#
# 如果你的板子是「裸 F103RB 核心板 + 外接 USB 转 SWD 的 ST-Link」，就不要用板卡脚本，
# 改成下面两行（等价、但更通用）：
#   source [find interface/stlink-v2.cfg]
#   source [find target/stm32f1x.cfg]
# 或者直接用同目录下的 generic-stlink-f103.cfg。

# --- 3. 复位方式 ---------------------------------------------------------------
# srst_only      ：只拉 NRST 复位（STM32 的复位引脚），不复位调试器本身
# srst_nogate    ：允许在 CPU 已 halt 时也执行 srst（否则 GDB 里 reset 会失败）
# 板卡脚本已设，这里显式写出来是为了说明「为什么必须这样」：
# 只做「软件复位」的话，SWD 时钟可能跟着一起乱，导致连接断开。
reset_config srst_only srst_nogate

# --- 4. 适配速度 ---------------------------------------------------------------
# ST-Link 默认 1MHz 左右；长排线或自制板可以降到 500kHz 先求能连上。
# adapter speed 1000

# --- 5. Flash 写入参数（F103RB = 128K，页大小 1K） -----------------------------
# target/stm32f1x.cfg 里已经声明：
#   flash bank $_FLASHNAME stm32f1x 0x08000000 0 0 0 $_TARGETNAME
# 不用自己写；列出来是提醒：0x08000000 这个地址和 stm32/01 里手写链接脚本的 ORIGIN 是同一个。
