# =============================================================================
# openocd/generic-stlink-f103.cfg —— 外接 ST-Link + 裸 F103 板（非 Nucleo）用这份
#
# 与 f103rb.cfg 的区别：不走「板卡脚本」（board/st_nucleo_f103rb.cfg 里绑定了
# Nucleo 的板载调试器和连接方式），而是分别指定「调试器」和「目标芯片」。
#
# 用法：
#   openocd -s <scripts> -f openocd/generic-stlink-f103.cfg
# =============================================================================

# 调试器：克隆版 ST-Link 大多是 V2（也有标 V2-1 的，两者 SWD 时序基本一致）
source [find interface/stlink-v2.cfg]

# 目标：整个 STM32F1 系列的 SWD tap + Cortex-M3 内核
source [find target/stm32f1x.cfg]

# 复位：只用 NRST。F103 的 BOOT0/BOOT1 决定从哪里启动，
# 用 OpenOCD 复位不会改这两个引脚，所以 BOOT0 必须已经在 0（从 Flash 启动）。
reset_config srst_only srst_nogate

# 连接不稳时逐级降速排查
# adapter speed 500
